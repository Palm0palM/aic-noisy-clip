# Bounded screening arm for the L2-SP pretrained anchor (2026-10-06).
#
# Identical to configs/v30/oof_a.yaml - same fold-A training list, 384px, 14
# epochs, same LR/LLRD/augmentation/EMA/seed - with ONE change: a quadratic pull
# of the backbone towards the official pretrained weights,
# (anchor_lambda/2)*||theta-theta0||^2. The random classification head is not
# anchored. anchor_lambda is filled in from scripts/probe_anchor_scale.py so the
# anchor gradient at the control's end state is 10% of the task gradient norm;
# it is fixed before the run and not scanned.
seed: 20260926

paths:
  project_root: /root/autodl-tmp/projects/AIC-Robust-CLIP-复赛

data:
  train_dir: /root/autodl-tmp/data/aic-rematch/train_cache384
  manifest: artifacts/train_manifest.csv
  split: artifacts/split95_seed20260926.json
  num_classes: 750
  expected_train_images: 148643
  decode_cap: 0
  image_size: 384
  eval_size: 384
  eval_resize_ratio: 1.14
  batch_size: 96
  val_batch_size: 128
  num_workers: 10
  prefetch_factor: 3

model:
  backbone: openai/clip-vit-base-patch32
  revision: c237dc49a33fc61debc9276459120b7eac67e7ef
  head: linear
  dropout: 0.0
  freeze_first_blocks: 0
  train_last_blocks: 0

augment:
  rrc_scale: [0.35, 1.0]
  color_jitter: 0.5
  rand_augment: true
  rand_augment_ops: 2
  rand_augment_magnitude: 7
  random_erase: 0.3
  mixup: 0.2
  cutmix: 1.0
  mix_prob: 0.8
  label_smoothing: 0.15

sampler:
  scheme: sqrt_inv
  power: 0.5

train:
  epochs: 14
  lr_backbone: 3.0e-5
  lr_head: 5.0e-4
  llrd_gamma: 0.8
  weight_decay: 0.15
  warmup_epochs: 1.0
  min_lr_ratio: 0.02
  grad_clip: 1.0
  ema_decay: 0.9995
  amp_dtype: bfloat16
  anchor_lambda: 0.05       # recalibrated 2026-10-06: 0.26 pinned the drift at 1.6 (16% of the
                            # control's 9.90) and cost ~9pp of in-sample val; the drift
                            # equilibrium scales with 1/alpha, so 0.05 targets ~85% of the control drift
  elr_lambda: 0.0
  elr_momentum: 0.9
  early_stop_patience: 0
  log_every: 200
  output_dir: checkpoints/anchor_a
