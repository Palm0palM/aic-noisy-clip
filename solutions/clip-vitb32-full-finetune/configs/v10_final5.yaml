# V10-FINAL5: last training run on deduplicated labels.
# 4,071 images (2.7%) sit in near-duplicate clusters whose labels contradict each
# other (cosine >= 0.97 within the model's own feature space). They provide
# contradictory supervision, so they are excluded. Epoch snapshots are kept so the
# last few epochs can also be averaged into a single SWA weight file.
seed: 20260926

paths:
  project_root: /root/autodl-tmp/projects/AIC-Robust-CLIP-复赛

data:
  train_dir: /root/autodl-tmp/data/aic-rematch/train
  manifest: artifacts/train_manifest.csv
  split: artifacts/split_seed20260921.json
  num_classes: 750
  expected_train_images: 148643
  decode_cap: 1152
  image_size: 576
  eval_size: 576
  eval_resize_ratio: 1.14
  batch_size: 80
  val_batch_size: 96
  num_workers: 12
  prefetch_factor: 3

model:
  backbone: openai/clip-vit-base-patch32
  revision: c237dc49a33fc61debc9276459120b7eac67e7ef
  head: linear
  dropout: 0.15
  freeze_patch_embed: false

augment:
  rrc_scale: [0.30, 1.0]
  color_jitter: 0.5
  rand_augment: true
  rand_augment_ops: 2
  rand_augment_magnitude: 10
  random_erase: 0.35
  mixup: 0.2
  cutmix: 1.0
  mix_prob: 0.8
  label_smoothing: 0.15

sampler:
  scheme: sqrt_inv
  power: 0.5

train:
  epochs: 4
  lr_backbone: 2.0e-6
  lr_head: 5.0e-5
  weight_decay: 0.15
  warmup_epochs: 0.25
  min_lr_ratio: 0.02
  grad_clip: 1.0
  ema_decay: 0.9995
  amp_dtype: bfloat16
  elr_lambda: 0.0
  elr_momentum: 0.9
  early_stop_patience: 0
  log_every: 100
  output_dir: checkpoints/v10_final5
