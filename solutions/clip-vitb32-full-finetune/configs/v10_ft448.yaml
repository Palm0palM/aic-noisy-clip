# V10-E: 448 px continuation (14x14 patch grid) straight from the original images.
# decode_cap lets Pillow's JPEG draft mode decode at ~2x the training resolution,
# which keeps the data pipeline fast enough without another resized cache.
seed: 20260926

paths:
  project_root: /root/autodl-tmp/projects/AIC-Robust-CLIP-复赛

data:
  train_dir: /root/autodl-tmp/data/aic-rematch/train
  manifest: artifacts/train_manifest.csv
  split: artifacts/split_seed20260921.json
  num_classes: 750
  expected_train_images: 148643
  image_size: 448
  eval_size: 448
  eval_resize_ratio: 1.14
  decode_cap: 896
  batch_size: 128
  val_batch_size: 160
  num_workers: 12
  prefetch_factor: 3

model:
  backbone: openai/clip-vit-base-patch32
  revision: c237dc49a33fc61debc9276459120b7eac67e7ef
  head: linear
  dropout: 0.0
  freeze_patch_embed: false

augment:
  rrc_scale: [0.50, 1.0]
  color_jitter: 0.4
  rand_augment: true
  rand_augment_ops: 2
  rand_augment_magnitude: 7
  random_erase: 0.25
  mixup: 0.2
  cutmix: 1.0
  mix_prob: 0.5
  label_smoothing: 0.1

sampler:
  scheme: sqrt_inv
  power: 0.5

train:
  epochs: 8
  lr_backbone: 8.0e-6
  lr_head: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 0.5
  min_lr_ratio: 0.02
  grad_clip: 1.0
  ema_decay: 0.9995
  amp_dtype: bfloat16
  elr_lambda: 0.0
  elr_momentum: 0.9
  early_stop_patience: 4
  log_every: 100
  output_dir: checkpoints/v10_ft448
