# 冠军模型(352px) 的缩放视图推理：384 memmap 中心裁 352（≈8% 放大），用于多视图 TTA
seed: 42

data:
  train_dir: "train_orig"
  test_dir: "test"
  num_classes: 500
  val_ratio: 0.05
  num_workers: 6
  index_cache: "cache/train_index_256.csv"
  bad_list: "cache/bad_images.json"
  train_mm: "cache/train_u8_384.npy"
  test_mm: "cache/test_u8_384.npy"
  test_names: "cache/test_names.json"
  mm_size: 384

model:
  clip_name: "cache/clip-vit-base-patch32"
  img_size: 352
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: ["q_proj", "v_proj"]
  train_ln: true
  logit_scale_init: 3.2188758248682006

train:
  epochs: 0
  out_dir: "outputs/tmp_zoom"

infer:
  batch_size: 288
  out_csv: "outputs/prelim_run2_352real/pred_zoom.csv"
