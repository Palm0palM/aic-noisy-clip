# run E (r5_run2)：8/30 原配方完整还原 —— 无零样本先验 + 硬划分三路损失（loss_mode: run2）
# 与 r5 唯一差异：损失结构还原为 干净样本CE / 高置信伪标签 / 低置信0.5权重GCE，无 mixup
# 路径为服务器相对路径（cd 到 AIC 目录运行）
seed: 42

data:
  train_dir: "cache/train_256"
  test_dir: "test"
  num_classes: 500
  val_ratio: 0.05
  num_workers: 6
  index_cache: "cache/train_index_256.csv"
  bad_list: "cache/bad_images.json"
  train_mm: "cache/train_u8_256.npy"
  test_mm: "cache/test_u8_256.npy"
  test_names: "cache/test_names.json"

model:
  clip_name: "cache/clip-vit-base-patch32"
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: ["q_proj", "v_proj"]   # run2 验证最有效的注入组合
  train_ln: true
  logit_scale_init: 3.2188758248682006  # ln(25)

train:
  epochs: 20
  warmup_epochs: 3
  batch_size: 160
  eval_batch_size: 384
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  min_lr_ratio: 0.01
  drift_lambda: 0.5
  ema_decay: 0.999
  loss_mode: "run2"          # 启用 8/30 原配方损失结构
  pseudo_conf_thr: 0.75      # 噪声样本伪标签置信门控（原配方阈值）
  clean_prob_thr: 0.6        # GMM 干净划分阈值（原配方阈值）
  gce_q: 0.7
  gmm_every: 2
  select_metric: "acc"       # 按原始 val acc 选 best.pt（cln 循环论证已弃用）
  amp: true
  out_dir: "outputs/prelim_r5_run2"

infer:
  batch_size: 512
  out_csv: "outputs/prelim_r5_run2/pred_results.csv"
