# scale-robust 重训：冠军配方 + RRC scale 0.5→0.35（唯一变量）
# 机理: 训练时 RRC 最大 1.41x 放大 < 测试视图 v4(1.45x)/v5(1.64x) = OOD；
# 放宽到 0.35 覆盖 1.69x，让模型原生擅长全部缩放视图
seed: 42

data:
  train_dir: "train_orig"
  test_dir: "test"
  num_classes: 500
  val_ratio: 0.05
  num_workers: 6
  index_cache: "cache/train_index_256.csv"
  bad_list: "cache/bad_images.json"
  train_mm: "cache/train_u8_352.npy"
  test_mm: "cache/test_u8_352.npy"
  test_names: "cache/test_names.json"
  mm_size: 352

model:
  clip_name: "cache/clip-vit-base-patch32"
  img_size: 352
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_targets: ["q_proj", "v_proj"]
  train_ln: true
  logit_scale_init: 3.2188758248682006

train:
  epochs: 20
  warmup_epochs: 3
  batch_size: 160
  eval_batch_size: 192
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  min_lr_ratio: 0.01
  drift_lambda: 0.5
  ema_decay: 0.999
  loss_mode: "run2"
  pseudo_conf_thr: 0.75
  clean_prob_thr: 0.6
  gce_q: 0.7
  gmm_every: 2
  select_metric: "acc"
  amp: true
  rrc_scale: [0.35, 1.0]
  out_dir: "outputs/prelim_scale035"

infer:
  batch_size: 384
  out_csv: "outputs/prelim_scale035/pred_results.csv"
